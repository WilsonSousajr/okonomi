# PostgreSQL. Ver docker-compose.yml para o banco de desenvolvimento (#22)
# e docs/BANCO-DE-DADOS.md para o projeto físico (#31).
#
# Nenhuma credencial tem valor padrão: senha vem sempre do ambiente. Um padrão
# embutido no repositório é uma credencial publicada.

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", "okonomi") %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>

development:
  <<: *default
  database: okonomi_development

# Recriado a cada execução da suíte — nunca aponte para um banco com dados reais.
test:
  <<: *default
  database: okonomi_test

# Bancos separados para app, cache, fila e cable, conforme o padrão do Rails 8.
production:
  primary: &production_primary
    <<: *default
    database: okonomi_production
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *production_primary
    database: okonomi_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *production_primary
    database: okonomi_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *production_primary
    database: okonomi_production_cable
    migrations_paths: db/cable_migrate
