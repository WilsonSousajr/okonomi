# Production deployment with Kamal, as described in docs/INFRAESTRUTURA.md (#33):
# one Linux VPS runs the app container, kamal-proxy (TLS) and PostgreSQL 17.
#
# The server address and the domain below are placeholders from documentation
# ranges (RFC 5737 IP, .exemplo.com.br): replace them with the real ones before
# the first `bin/kamal setup` (step 3 of the deployment procedure in the doc).

# Name of your application. Used to uniquely configure containers.
service: okonomi

# Name of the container image, under the registry user.
image: wilsonsousajr/okonomi

# Deploy to these servers.
servers:
  web:
    - 203.0.113.10

# kamal-proxy terminates TLS with a Let's Encrypt certificate (docs §5.1). This
# requires config.assume_ssl and config.force_ssl in production.rb, both on (#40).
proxy:
  ssl: true
  host: okonomi.exemplo.com.br

# Where you keep your container images.
registry:
  server: ghcr.io
  username: wilsonsousajr
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    # Points at the db accessory, without a database name: database.yml names the
    # four databases (primary, cache, queue, cable) on the same server.
    - DATABASE_URL
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # The only job is the password reset e-mail, so a separate job host is not needed.
    SOLID_QUEUE_IN_PUMA: true

    # Domain used in the links of the password reset e-mail (docs §5.3).
    APP_HOST: okonomi.exemplo.com.br

    # SMTP server of the transactional e-mail service (docs §5.3); user and
    # password come from the Rails credentials.
    SMTP_ADDRESS: smtp.exemplo.com.br

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Persistent volume for local files written by the app (Active Storage is not used).
volumes:
  - "okonomi_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

# PostgreSQL 17 on the same server (docs §3.3, §5.2). Port 5432 is bound to the
# loopback interface only: the app reaches it through Kamal's Docker network as
# okonomi-db, and nothing on the internet can.
accessories:
  db:
    image: postgres:17-alpine
    host: 203.0.113.10
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: okonomi
        POSTGRES_DB: okonomi_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
