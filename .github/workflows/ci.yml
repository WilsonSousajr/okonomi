# Gate de integração contínua (#23).
#
# O job `ci` no fim agrega todos os demais e é o único check exigido pela
# proteção do branch `main`. Assim, adicionar um passo novo ao gate não exige
# reconfigurar a proteção do branch.

name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.run_id }}
          restore-keys: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-
      - run: bin/rubocop -f github

  security:
    name: Brakeman e auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Brakeman (análise estática de segurança)
        run: bin/brakeman --no-pager
      - name: bundler-audit (CVEs conhecidas em gems)
        run: bin/bundler-audit --update
      - name: importmap audit (CVEs conhecidas em JS)
        run: bin/importmap audit

  test:
    name: Testes de unidade e controller
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: okonomi
          # Contêiner efêmero, acessível apenas pelo runner deste job. Usar
          # `trust` evita ter qualquer senha escrita no repositório.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: okonomi
    steps:
      - name: Instalar pacotes do sistema
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bin/rails db:test:prepare test

  system-test:
    name: Testes de sistema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: okonomi
          # Contêiner efêmero, acessível apenas pelo runner deste job. Usar
          # `trust` evita ter qualquer senha escrita no repositório.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: okonomi
    steps:
      - name: Instalar pacotes do sistema
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bin/rails db:test:prepare test:system
      - name: Guardar screenshots de testes de sistema que falharam
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # Check único exigido pela proteção do branch main.
  # Falha se QUALQUER job acima falhar, for cancelado ou for pulado.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [ lint, security, test, system-test ]
    if: always()
    steps:
      - name: Verificar resultado dos jobs
        run: |
          echo "lint........: ${{ needs.lint.result }}"
          echo "security....: ${{ needs.security.result }}"
          echo "test........: ${{ needs.test.result }}"
          echo "system-test.: ${{ needs.system-test.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::O gate falhou. Veja os jobs acima."
            exit 1
          fi
          echo "Gate verde."
